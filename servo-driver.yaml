esphome:
  name: waveshare-servo
  friendly_name: Waveshare Servo Driver

esp32:
  board: esp32dev
  framework:
    type: arduino

# --- Local custom component (this repo) ---
external_components:
  - source:
      type: local
      path: components

logger:
  # UART0 over the CP2102/USB — separate from the servo bus (UART1). Keep this
  # below the servo baud so it never clashes.
  baud_rate: 115200
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the network can't be reached, fall back to a hotspot so the board is
  # never bricked/unreachable.
  ap:
    ssid: "Waveshare-Servo Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

# Steps-per-degree for the ST3235 (4096 counts over 360°).
substitutions:
  steps_per_deg: "11.3778"

# ================= ST3215 / ST3235 servo bus =================
uart:
  id: servo_uart
  tx_pin: GPIO19   # S_TXD on the Waveshare Servo Driver with ESP32
  rx_pin: GPIO18   # S_RXD
  baud_rate: 1000000

st3215:
  - id: servo_bus
    uart_id: servo_uart
    update_interval: 500ms

# ---- Feedback sensors ----
sensor:
  - platform: st3215
    st3215_id: servo_bus
    servo_id: 1
    position:
      name: "Servo Position"
      id: servo_position
    speed:
      name: "Servo Speed"
      id: servo_speed
    load:
      name: "Servo Load"
      id: servo_load
    current:
      name: "Servo Current"
      id: servo_current
    voltage:
      name: "Servo Voltage"
    temperature:
      name: "Servo Temperature"

  # ---- Valve feedback: where the valve actually is, 0-100% ----
  - platform: template
    name: "Valve Actual"
    id: valve_actual
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:valve
    update_interval: 500ms
    lambda: |-
      float off_steps = id(valve_off_angle).state * ${steps_per_deg};
      float on_steps  = id(valve_on_angle).state  * ${steps_per_deg};
      float pos = id(servo_position).state;
      if (isnan(pos) || on_steps == off_steps) return NAN;
      float pct = (pos - off_steps) / (on_steps - off_steps) * 100.0f;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;

binary_sensor:
  - platform: st3215
    st3215_id: servo_bus
    servo_id: 1
    moving:
      name: "Servo Moving"

  # ---- Valve jammed detection ----
  # True when torque is on, the valve isn't at its commanded target, it isn't
  # moving, and it's still pushing hard -> physically jammed somewhere.
  - platform: template
    name: "Valve Stalled"
    id: valve_stalled
    device_class: problem
    icon: mdi:alert-octagon
    lambda: |-
      if (!id(servo_torque).state) return false;
      float target = id(servo_target_position).state;   // commanded steps
      float pos    = id(servo_position).state;           // present steps
      float speed  = id(servo_speed).state;              // steps/s
      float load   = id(servo_load).state;               // % effort
      if (isnan(target) || isnan(pos) || isnan(speed) || isnan(load))
        return false;
      bool at_target  = fabs(target - pos) < 25;         // within ~2.2°
      bool not_moving = fabs(speed) < 15;                // essentially stopped
      bool pushing    = fabs(load) > 15.0;               // still applying effort
      return (!at_target) && not_moving && pushing;
    filters:
      - delayed_on: 750ms    # must persist to count as a real jam
      - delayed_off: 250ms

# ---- Controls ----
number:
  - platform: st3215
    st3215_id: servo_bus
    servo_id: 1
    target_position:
      name: "Servo Target Position"
      id: servo_target_position
    goal_speed:
      name: "Servo Goal Speed"
    acceleration:
      name: "Servo Acceleration"
    torque_limit:
      name: "Servo Torque Limit"

  # ---- Valve endpoint calibration (degrees of servo travel) ----
  - platform: template
    name: "Valve Off Angle"
    id: valve_off_angle
    unit_of_measurement: "°"
    icon: mdi:valve-closed
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  - platform: template
    name: "Valve On Angle"
    id: valve_on_angle
    unit_of_measurement: "°"
    icon: mdi:valve-open
    min_value: 0
    max_value: 360
    step: 1
    initial_value: 90
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # ---- The valve command: 0% = off angle, 100% = on angle ----
  - platform: template
    name: "Valve"
    id: valve_position
    unit_of_measurement: "%"
    icon: mdi:valve
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    mode: slider
    set_action:
      - lambda: |-
          float off_steps = id(valve_off_angle).state * ${steps_per_deg};
          float on_steps  = id(valve_on_angle).state  * ${steps_per_deg};
          float steps = off_steps + (x / 100.0f) * (on_steps - off_steps);
          if (steps < 0) steps = 0;
          if (steps > 4095) steps = 4095;
          // Energize the motor, then command the interpolated position.
          id(servo_torque).turn_on();
          auto call = id(servo_target_position).make_call();
          call.set_value(steps);
          call.perform();

switch:
  - platform: st3215
    st3215_id: servo_bus
    servo_id: 1
    torque:
      name: "Servo Torque"
      id: servo_torque

select:
  - platform: st3215
    st3215_id: servo_bus
    servo_id: 1
    mode:
      name: "Servo Mode"

button:
  - platform: st3215
    st3215_id: servo_bus
    servo_id: 1
    calibrate_center:
      name: "Servo Calibrate Center"
